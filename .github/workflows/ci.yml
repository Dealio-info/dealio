name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres, because the invariants
      # worth testing — the append-only ledger trigger, the check constraints,
      # the idempotency unique indexes — exist in the database. A mock would
      # prove nothing about them.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite creates this database itself if it is missing. Deliberately
      # distinct from DATABASE_URL, which is unset here — the harness refuses to
      # run if the two match, so a misconfiguration cannot truncate real data.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealio_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which needs no database.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
